<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Test Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Enhanced Card & Form Styling -->
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-primary text-white text-center py-3 rounded-top-4">
                    <h3 class="mb-0">Test Project Flow</h3>
                </div>
                <div class="card-body p-4">
                    <form action="/submit-form" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="Enter Your Name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label fw-bold">Message/Details</label>
                            <textarea class="form-control" id="message" name="message" rows="3" placeholder="Enter Details to store in the database"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">Submit to Database</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
