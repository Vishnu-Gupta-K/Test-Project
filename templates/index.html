<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-reader bg-primary text-white">
                        <h3 class="mb-0">Test Project Flow</h3>
                    </div>
                    <div class="card-body">
                        <form action="/submit-form" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" name="name" required placeholder="Enter Your Name">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="Enter Your Email Address">
                            </div>             
                            <div class="mb-3">
                                <label for="message" class="form-label">Message/Details</label>
                                <textarea class="form-control" id="message" name="message" rows="3" placeholder="Enter Details to store in the database"></textarea>
                            </div>           
                            <button type="submit" class="btn btn-success w-100">Submit to Database</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
